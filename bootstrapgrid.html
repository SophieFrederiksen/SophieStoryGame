<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body class="bg-accent">
     <nav class="navbar md:navbar-expand bg-1 theme-primary ">
  <div class="container-fluid bg-info">
    <a class="navbar-brand" href="#">Recipes for the food</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto theme-info">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="https://entirelyelizabeth.com/biscoff-blondies/">Biscoff Blondie Recipe</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://sallysbakingaddiction.com/funfetti-layer-cake/">Birthday Cake Recipe</a>
          </li>
          <li class="nav-item">
            <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
              Order Food
            </button>
            <div class="menu">
              <a class="menu-item" href="https://www.chilis.com/menu">Chilis</a>
              <a class="menu-item" href="https://www.thestation-berkeley.com/">The Station Smashburgers</a>
              <a class="menu-item" href="https://www.ebikosushi.com/">Ebiko Sushi</a>
            </div>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
          </li>
        </ul>
        <form class="hstack gap-2" role="search">
          <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn-solid btn-icon theme-secondary" type="submit">
            <svg class="bi" width="16" height="16"><use href="#search" /></svg>
          </button>
        </form>
      </div>
    </dialog>
  </div>
</nav>
    <h1 class="text-center">Keep 3 Cut 3</h1>
    <div class="container text-center border border-primary border-5">
  <div class="row border border-primary border-5">
    <div class="col border border-info border-3">
      <img src="sushigrid.jpeg" alt="sushi" width="100" height="150">
      <h5>Sushi</h5>
    </div>
    <div class="col border border-info border-3">
      <img src="cakegrid.jpeg" alt="cake" width="100" height="150">
      <h5>Birthday Cake</h5>
    </div>
    <div class="col border border-info border-3">
      <img src="chilis3dip.jpeg" alt="chili's 3 dip" width="100" height="150">
      <h5>Chili's Tripple Dipper</h5>
    </div>
  </div>
  <div class="row border border-primary border-5">
    <div class="col border border-info border-3">
      <img src ="biscoffgrid.jpeg" alt="biscoff" width="100" height="150">
        <h5>Biscoff Blondies</h5>
    </div>
    <div class="col border border-info border-3">
      <img src="burgergrid.jpeg" alt="burger" width="100" height="150">
      <h5> Smash Burger</h5>
    </div>
    <div class="col border border-info border-3">
      <img src ="friesgrid.jpeg" alt="fries" width="100" height="150">
        <h5>Waffle Fries</h5>
    </div>
  </div>
</div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
