<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body class="bg-accent">
    <div class="container">
      <div class="row">
        <div class="col-12 col-md-8 col-lg-6">
        </div>
      </div>
    </div>
    <h1 class="display-1 text-center border border-primary border-5">Lost Sandwich</h1>
    <h5 class="text-center">I have lost my sandwich! Can you help me find it?</h5>
    <p class="text-center">Reward:$1,000,000</p>
    <div id="carouselStacked" class="carousel slide">
  <div class="d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Scroll to see pics</h5>
    <div class>
      <button class= "btn-icon btn-sm theme-primary" type="button" data-bs-target="#carouselStacked" data-bs-slide="prev" >
        <span class="carousel-icon-prev theme-primary" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="btn-icon btn-sm theme-primary" type="button" data-bs-target="#carouselStacked" data-bs-slide="next">
        <span class="carousel-icon-next theme-primary" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
  <div class="carousel-inner rounded-5">
    <div class="carousel-item active">
      <img src="rottensandwich1.jpeg" class="d-block w-100" alt="sandwich1">
    </div>
    <div class="carousel-item">
      <img src="rottensandwich2.jpeg" class="d-block w-100" alt="sandwich2">
    </div>
    <div class="carousel-item">
      <img src="rottensandwich3.webp" class="d-block w-100" alt="sandwich3">
    </div>
  </div>
</div>
<div class="form-field">
  <h3>Have you seen my sandwich?</h3>
  <input class="radio" name="radios" type="radio" id="radioLabel" />
  <label for="radioLabel">Yes</label>
</div>
<div class="form-field">
  <input class="radio" name="radios" type="radio" id="radioLabel2" />
  <label for="radioLabel2">No</label>
</div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
